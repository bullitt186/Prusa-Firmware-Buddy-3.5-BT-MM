name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag or branch to build from
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.upstream-ref.outputs.ref }}
      upstream_source_ref: ${{ steps.source-ref.outputs.ref }}
      release_tag: ${{ steps.release-meta.outputs.tag }}
      release_name: ${{ steps.release-meta.outputs.name }}
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Resolve upstream ref
        id: upstream-ref
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.upstream_ref }}" ]]; then
            ref="${{ github.event.inputs.upstream_ref }}"
          else
            ref="$(< patches-repo/.github/upstream-ref.txt)"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Using upstream ref: ${ref}"

      - name: Resolve upstream source ref
        id: source-ref
        shell: bash
        run: |
          ref="${{ steps.upstream-ref.outputs.ref }}"
          version="${ref#v}"
          release_branch="RELEASE-${version}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && git ls-remote --exit-code --heads https://github.com/prusa3d/Prusa-Firmware-Buddy.git "${release_branch}" >/dev/null 2>&1; then
            source_ref="${release_branch}"
            echo "Using upstream release branch: ${source_ref}"
          else
            source_ref="${ref}"
            echo "Using upstream release tag/ref: ${source_ref}"
          fi
          echo "ref=${source_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build release metadata
        id: release-meta
        shell: bash
        run: |
          ref="${{ steps.upstream-ref.outputs.ref }}"
          echo "tag=${ref}-bt-mm" >> "${GITHUB_OUTPUT}"
          echo "name=BT-MM firmware ${ref}" >> "${GITHUB_OUTPUT}"

  build-mk35:
    needs: prepare
    name: Build MK3.5 (${{ matrix.artifact_suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bootloader: "no"
            artifact_suffix: noboot
          - bootloader: "yes"
            artifact_suffix: boot

    env:
      PRESET: mk3.5
      BUILD_TYPE: release
      BUILD_DIR: build
      PRODUCTS_DIR: build/products

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: prusa3d/Prusa-Firmware-Buddy
          ref: ${{ needs.prepare.outputs.upstream_source_ref }}
          fetch-depth: 0
          path: source

      - name: Apply custom patch series
        working-directory: source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          patches=("${GITHUB_WORKSPACE}"/patches-repo/patches/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "No patch files found under patches/"
            exit 1
          fi
          git am "${patches[@]}"
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Cache toolchain downloads
        uses: actions/cache@v4
        with:
          path: source/.dependencies
          key: ${{ runner.os }}-buddy-dependencies-${{ needs.prepare.outputs.upstream_ref }}-${{ hashFiles('patches-repo/patches/*.patch', 'source/requirements.txt', 'source/utils/bootstrap.py') }}

      - name: Show tool versions
        working-directory: source
        run: |
          python --version
          git --version
          git log --oneline -n 3

      - name: Build firmware
        working-directory: source
        run: |
          python utils/build.py \
            --preset "${PRESET}" \
            --build-type "${BUILD_TYPE}" \
            --bootloader "${{ matrix.bootloader }}" \
            --build-dir "${BUILD_DIR}" \
            --products-dir "${PRODUCTS_DIR}" \
            --store-output

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk3.5-${{ env.BUILD_TYPE }}-${{ matrix.artifact_suffix }}-${{ needs.prepare.outputs.upstream_ref }}
          if-no-files-found: warn
          path: |
            source/build/products/*
            source/build/**/stdout.txt
            source/build/**/stderr.txt

  release:
    needs:
      - prepare
      - build-mk35
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -name '*.bbf' -o \
            -name '*.bin' -o \
            -name '*.map' -o \
            -name 'mk3.5_release_boot' -o \
            -name 'mk3.5_release_noboot' \
          \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.release_tag }}"
          name="${{ needs.prepare.outputs.release_name }}"
          notes=$(cat <<'EOF'
          Built from upstream ${{ needs.prepare.outputs.upstream_ref }}

          Patches applied from this repository.
          EOF
          )
          if gh release view "${tag}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber --repo "${GH_REPO}"
          else
            gh release create "${tag}" release-assets/* \
              --repo "${GH_REPO}" \
              --title "${name}" \
              --notes "${notes}"
          fi
